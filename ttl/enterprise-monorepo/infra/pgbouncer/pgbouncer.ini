[databases]
# route all connections to postgres container
production_metrics = host=postgres port=5432 dbname=production_metrics

[pgbouncer]
listen_addr = *
listen_port = 6432

# scram-sha-256 — never use 'any' or 'trust' in prod
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# transaction pooling — releases conn back to pool after each tx
pool_mode = transaction

# connection limits
max_client_conn = 5000
default_pool_size = 20
reserve_pool_size = 5

# health checks against upstream postgres
server_check_query = SELECT 1
server_check_delay = 30

# admin access
admin_users = pipeline_admin
stats_users = pipeline_admin

# logging — useful for debugging conn issues
log_connections = 1
log_disconnections = 1
